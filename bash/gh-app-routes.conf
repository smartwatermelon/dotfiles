# Repos whose gh calls and git pushes act as a GitHub App, not as Andrew (smartwatermelon/claude-config#659).
# Read by bash/gh-app-token.sh. One route per line: owner/repo, a TAB, then the 1Password item holding
# the App's app_id, installation_id and private_key. Unlisted repos keep the per-owner PATs.
# Optional TAB-separated app_id=N and installation_id=N after the item: the minter then reads only the key,
# from the macOS login Keychain or, where the Keychain has no item, from op. These IDs are not secrets.
# Pilot: one repo. Remove its line to stop routing it.
smartwatermelon/claude-wrapper	op://Automation/smartwatermelon-agent app	app_id=5401431	installation_id=173522549
