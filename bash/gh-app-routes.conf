# Repos whose gh calls and git pushes act as a GitHub App, not as Andrew (smartwatermelon/claude-config#659).
# Read by bash/gh-app-token.sh. One route per line: owner/repo or owner/*, a TAB, then the 1Password item holding
# the App's app_id, installation_id and private_key. Unlisted repos keep the per-owner PATs.
# Optional TAB-separated app_id=N and installation_id=N after the item: the minter then reads only the key,
# from the macOS login Keychain or, where the Keychain has no item, from op. These IDs are not secrets.
# owner/* routes every repo of that owner; an owner/repo line beats it.
# smartwatermelon: every repo (the agent App is installed on all of them, with Actions write).
# Remove the line to stop routing.
smartwatermelon/*	op://Automation/smartwatermelon-agent app	app_id=5401431	installation_id=173522549
# nightowlstudiollc: every repo (the org-owned nightowlstudiollc-agent App is installed on all of them; per-org key).
# Widened from the stupid-github-app pilot (dev-env#264) so kebab-tax PRs are opened by the App, which Andrew can approve.
nightowlstudiollc/*	op://Automation/nightowlstudiollc-agent app	app_id=5674204	installation_id=180017956
