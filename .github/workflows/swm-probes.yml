name: swm macOS runner probes

# Test-only: dev-env Task 8 Step 3 runner proof. Draft PR, never merged.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Hook-env probe: if workflow env reached the job-started hook, it would deny.
env:
  JQ_BIN: /nonexistent
  ALLOWED_OWNERS: nobody

jobs:
  lan-probes:
    runs-on: mimolette-macos
    steps:
      - name: Record the VM network state
        run: |
          /sbin/ifconfig | grep -E '^[a-z]|inet6? '
          /usr/sbin/netstat -rn -f inet | grep default || true
          /usr/sbin/netstat -rn -f inet6 | grep default || true

      - name: Positive controls (DNS via 192.168.65.1 and HTTPS to github.com work)
        run: |
          dig +short +time=3 +tries=1 @192.168.65.1 github.com | grep -E '^[0-9.]+$'
          curl -fsS -o /dev/null -m 10 https://github.com
          echo "controls ok"

      - name: LAN and host probes (every target must time out)
        run: |
          # pf uses "block drop", so a blocked target times out. A connect or a
          # refusal both mean the target is reachable, and fail the step.
          fail=0
          probe() {
            local fam="$1" host="$2" port="$3" out
            out="$(/usr/bin/nc "${fam}" -v -z -G 3 -w 3 "${host}" "${port}" 2>&1)" || true
            if grep -qiE 'succeeded|refused|open' <<<"${out}"; then
              echo "REACHABLE ${fam} ${host}:${port}: ${out}"; fail=1
            elif grep -qiE 'timed out|timeout|no route|unreachable' <<<"${out}"; then
              echo "blocked ${fam} ${host}:${port}: ${out}"
            else
              echo "PROBE ERROR ${fam} ${host}:${port}: ${out}"; fail=1
            fi
          }
          probe -4 10.0.15.1 80
          probe -4 10.0.15.1 443
          probe -4 10.0.15.63 22
          probe -4 10.0.15.22 22
          probe -4 192.168.65.1 22
          probe -4 192.168.64.1 22
          probe -4 169.254.169.254 80
          probe -6 fd09:9b8e:c67:4541:ca:aa50:4a9e:aa3b 22
          probe -6 fd09:9b8e:c67:4541:1cb2:50f6:54b9:53d8 22
          probe -6 fd6b:c0b2:13dc:ef41:10f3:b61a:5cd9:2c59 22
          probe -6 fdaa:e079:341f:9b25:1ca9:3705:d854:a93a 22
          exit "${fail}"

  hook-env:
    runs-on: mimolette-macos
    env:
      JQ_BIN: /nonexistent
      ALLOWED_OWNERS: nobody
    steps:
      - name: The job ran, so the hook allowed it
        run: |
          echo "hook allowed this job; workflow env seen by steps:"
          echo "JQ_BIN=${JQ_BIN} ALLOWED_OWNERS=${ALLOWED_OWNERS}"
